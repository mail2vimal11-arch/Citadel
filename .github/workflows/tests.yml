name: Tests

# The comprehensive test matrix, on a standard cadence (see TESTING.md for the
# full mapping of test types -> tooling -> frequency).
#
#   unit         every push + PR   — unit, integration, regression, sanity, white-box
#   e2e          every push + PR   — smoke, system, end-to-end, black-box, UAT scenarios
#   performance  nightly + manual  — performance, load, stress
#
# ci.yml stays the fast typecheck+build+deploy gate; security.yml owns security
# testing. This workflow is the breadth.

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 5 * * *" # nightly 05:00 UTC — performance run
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Unit + integration + regression, with coverage (white-box visibility).
  unit:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
      AI_PROVIDER: "heuristic"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Unit + integration tests (with coverage)
        run: npm run test:coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  # Smoke + system + end-to-end + black-box, via Playwright against a real build.
  e2e:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      AI_PROVIDER: "heuristic"
      DATABASE_URL: "file:./e2e.db"
      FORGET_SWEEP_INTERVAL_MS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npx next build
      - name: E2E tests (Playwright boots the built app)
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  # Performance + load + stress. Heavy, so nightly / on-demand only.
  performance:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      AI_PROVIDER: "heuristic"
      DATABASE_URL: "file:./e2e.db"
      FORGET_SWEEP_INTERVAL_MS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Build
        run: npx next build
      - name: Start app
        run: |
          npx next start -H 127.0.0.1 -p 3100 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3100/api/health >/dev/null && exit 0
            sleep 2
          done
          echo "app did not become healthy"; exit 1
      - name: Load test
        run: BASE_URL=http://127.0.0.1:3100 npm run perf:load
      - name: Stress test
        run: BASE_URL=http://127.0.0.1:3100 npm run perf:stress
